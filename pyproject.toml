[project]
name = "vintedbot"
version = "0.1.0"
description = "Monitor Vinted listings matching saved search filters and flag underpriced items"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.13",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rich>=13.7",
    "structlog>=25.4",
]

[project.scripts]
vintedbot = "vintedbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "mypy>=1.17",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vintedbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
packages = ["vintedbot"]
mypy_path = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime: keep their imports out of TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
